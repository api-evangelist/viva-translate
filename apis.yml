name: Viva Translate
description: Viva Translate is an AI-powered real-time translation platform that acts
  as a personal meeting analyst, delivering live translation, transcription, automatic
  summaries, and action items across Google Meet, Microsoft Teams, and Zoom. Reported
  usage spans 1M+ minutes translated, 20+ countries, and 1.8k+ companies. The company
  ships a consumer/B2B product (no public developer API, SDK, or developer portal at
  this time) and has open-sourced its browser-based translation tooling as a Chrome
  extension that consumes third-party DeepL, Gladia, and OpenAI APIs. Surfaced as a
  portfolio company of general-catalyst and enriched by the API Evangelist pipeline.
